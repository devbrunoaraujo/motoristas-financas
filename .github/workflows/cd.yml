# .github/workflows/cd.yml
#
# Diferente do ci.yml (que roda em develop e main, testando e
# publicando imagens no ECR), este workflow só faz uma coisa: quando
# algo é mergeado em MAIN, conecta na EC2 via SSH e manda ela puxar
# as imagens mais novas do ECR e reiniciar os containers.
#
# Ou seja: merge em develop = build + testa + publica no ECR.
#          merge em main    = tudo isso + DEPLOY em produção.

name: CD

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      # Copia o docker-compose.ec2.yml atualizado para a EC2, caso
      # ele tenha mudado nesse commit. Se não mudou, sobrescreve com
      # o mesmo conteúdo — sem problema.
      - name: Copia o docker-compose.ec2.yml para a EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.EC2_HOST }}
          username: ${{ vars.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          source: "docker-compose.ec2.yml"
          target: "/home/ubuntu/kmup"

      # Conecta via SSH e manda a própria EC2 se autenticar no ECR
      # (usando a IAM Role que ela já tem — nenhuma chave AWS entra
      # aqui) e reiniciar os containers com as imagens mais novas.
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.EC2_HOST }}
          username: ${{ vars.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            cd /home/ubuntu/kmup
            aws ecr get-login-password --region us-east-1 | sudo docker login --username AWS --password-stdin 116884075753.dkr.ecr.us-east-1.amazonaws.com
            sudo docker compose -f docker-compose.ec2.yml pull
            sudo docker compose -f docker-compose.ec2.yml up -d
            sudo docker image prune -f
