# Este arquivo substitui a config padrão do Nginx dentro da imagem.
# Um "server" descreve como o Nginx deve responder às requisições
# que chegam nele.
server {
    # Porta em que este bloco "server" escuta dentro do container.
    listen 80;

    # "_" = aceita qualquer nome de domínio/host apontando pra cá.
    # Isso está OK porque, na nossa arquitetura, quem decide o domínio
    # público é a camada na frente (ex: outro Nginx/Load Balancer na AWS).
    server_name _;

    # Pasta onde estão os arquivos que copiamos do estágio "build"
    # (o resultado do "npm run build").
    root /usr/share/nginx/html;
    index index.html;

    # ESSA É A PARTE MAIS IMPORTANTE PRA UMA SPA (React/Vue/etc):
    #
    # Quando alguém acessa diretamente uma URL tipo
    # "seusite.com/dashboard" (em vez de navegar clicando dentro do
    # app), o navegador manda essa requisição pro servidor. Mas
    # "/dashboard" não é um arquivo real — quem sabe montar essa tela
    # é o JavaScript do React Router, rodando no navegador.
    #
    # "try_files $uri $uri/ /index.html" diz ao Nginx:
    #   1. Tenta servir o arquivo exato pedido ($uri)
    #   2. Se não existir, tenta como se fosse uma pasta ($uri/)
    #   3. Se nada bater, devolve o index.html de qualquer jeito
    # Assim o React assume o controle e mostra a rota certa.
    # Sem isso, dar F5 em qualquer rota que não seja "/" resultaria
    # em erro 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Arquivos gerados pelo Vite (JS/CSS/imagens) já vêm com um hash
    # único no nome (ex: index-a1b2c3.js). Ou seja: se o conteúdo
    # mudar, o nome do arquivo muda também. Isso nos permite dizer
    # ao navegador "guarda isso em cache por 1 ano sem medo", porque
    # se o código mudar, o nome do arquivo muda e o cache antigo
    # simplesmente não é mais referenciado.
    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
