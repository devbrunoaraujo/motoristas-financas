spring:
  application:
    name: motoristas-financas-api

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:financas_db}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Sao_Paulo
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # 'update' é conveniente em desenvolvimento; trocar por migrations
      # (Flyway/Liquibase) antes de ir para produção.
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:troque-este-segredo-em-producao-por-uma-chave-forte}
  expiration-minutes: 60

springdoc:
  swagger-ui:
    path: /docs
