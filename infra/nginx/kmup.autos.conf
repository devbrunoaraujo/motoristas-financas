# infra/nginx/kmup.autos.conf
#
# Este arquivo é APLICADO MANUALMENTE na EC2 (não faz parte do
# Docker Compose nem do pipeline de CD) — igual fizemos com o .env.
# Fica versionado aqui só como referência/documentação.
#
# Depois de rodar o Certbot, ele reescreve este arquivo sozinho,
# adicionando os blocos de HTTPS (listen 443, caminhos dos
# certificados, redirect automático). O bloco abaixo é o estado
# ANTES do Certbot rodar — só HTTP, na porta 80.

server {
    listen 80;
    listen [::]:80;
    server_name kmup.autos www.kmup.autos;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
