# infra/nginx/grafana.kmup.autos.conf
# Mesma observação dos outros dois arquivos.

server {
    listen 80;
    listen [::]:80;
    server_name grafana.kmup.autos;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # O Grafana usa WebSocket para atualizar dashboards ao vivo —
        # sem isso, essa parte específica quebra (o resto funciona).
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
